<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metabolic activity of immune cells · C60(OH)24</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="images/favicon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <a class="lab-logo" href="https://lei-lab.com/" target="_blank" rel="noopener" aria-label="LEI Lab website">
        <img src="images/lab_logo_dark.png" alt="LEI Lab">
      </a>
      <div class="titles">
        <h1 data-i18n="appTitle"></h1>
        <p class="subtitle" data-i18n="appSubtitle"></p>
      </div>
    </div>
    <div class="header-right">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" id="lang-en">
          <img src="images/flags/us.svg" alt="" width="18" height="12">
          EN
        </button>
        <button type="button" id="lang-ru">
          <img src="images/flags/ru.svg" alt="" width="18" height="12">
          RU
        </button>
      </div>
      <a class="github-link" href="https://github.com/lasest/metabolism_db" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>

  <main>
    <aside id="controls">
      <h2 data-i18n="filtersTitle"></h2>

      <label class="field">
        <span data-i18n="cellType"></span>
        <select id="cell-type"></select>
      </label>

      <label class="field">
        <span data-i18n="exposureTime"></span>
        <select id="exposure"></select>
      </label>

      <label class="field">
        <span data-i18n="parameter"></span>
        <select id="parameter"></select>
      </label>

      <fieldset class="field">
        <legend data-i18n="replicates"></legend>
        <div id="replicate-boxes"></div>
      </fieldset>

      <label class="field">
        <span data-i18n="groupBy"></span>
        <select id="group-by">
          <option value="none" data-i18n="groupNone"></option>
          <option value="concentration" data-i18n="groupConcentration"></option>
          <option value="replicate" data-i18n="groupReplicate"></option>
        </select>
      </label>

      <label class="field">
        <span data-i18n="plotType"></span>
        <select id="plot-type">
          <option value="scatter" data-i18n="plotScatter"></option>
          <option value="box" data-i18n="plotBox"></option>
          <option value="bar" data-i18n="plotBar"></option>
          <option value="line" data-i18n="plotLine"></option>
        </select>
      </label>
      <p class="hint" id="plot-hint" hidden data-i18n="plotHintNone"></p>

      <label class="check">
        <input type="checkbox" id="log-y">
        <span data-i18n="logY"></span>
      </label>

      <div class="buttons">
        <button type="button" id="export-csv" data-i18n="exportCsv"></button>
        <button type="button" id="export-png" data-i18n="exportPng"></button>
      </div>

      <p id="status" class="status"></p>
    </aside>

    <section id="content">
      <div id="chart"></div>
      <h2 data-i18n="tableTitle"></h2>
      <div class="table-wrap">
        <table id="records">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <footer data-i18n="footer"></footer>
      <p class="funding" data-i18n="funding"></p>
    </section>
  </main>

  <script src="libs/plotly.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
